<!DOCTYPE html>

<head>


<title>Continental Hotel Reservation Form</title>

<style>

  body {
    margin: 20px;
  }
  .container {
    background-color: lightgrey;
    width: 500px;
    margin: 0 auto;
    padding: 50px;
  }
  h2 {
    color: red;
    text-align: center;
    font-size: 25px;
  }
  table {
    background-color: lightblue;
    border-spacing: 5px;
    width: 90%;
  }
  td {
    background-color: lightblue;
    border: 1px solid black;
    padding: 5px;
    font-size: 20px;
  }
  td.label {
    text-align: center;
    width: 30%;
  }
  input[type="text"], input[type="email"] {
    width: 230px;
    padding: 5px;
    border: 1px solid black;
  }
</style>
<form>
</head>
<body>
<div class="container">
    <h2>Continental Hotel Reservation Form</h2>

    <table>
     <tr>
      <td class="label">Name</td>
        <td><input type="text" name="name" placeholder="Enter your name"></td>
        </tr>
        <tr>
         <td class="label">Email</td>
         <td><input type="email" name="email" value="info@continental.pk"></td>
        </tr>
        <tr>
         <td class="label">Mobile No</td>
         <td><input type="text" name="mobile" placeholder="Enter your cell number"></td>
        </tr>
        <tr>
         <td class="label">Arrival Time</td>
         <td><input type="text" name="arrival" placeholder="Enter your arrival time"></td>
        </tr>
        <tr>
          <td class="label">Departure</td>
          <td>
           <input type="text" name="departure_date">
           <input type="text" name="departure_time">
          </td>
        </tr>
        <tr>
         <td class="label">Room Type</td>
         <td>
           <label><input type="radio" name="room" value="single">Single</label>
           <label><input type="radio" name="room" value="double"> Double</label><br>
           <label><input type="radio" name="room" value="suite"> Presidential Suite </label>
         </td>
        </tr>
        <tr>
         <td class="label">Preferences</td>
         <td>
           <label><input type="checkbox" value="non-smoking"> Non-Smoking</label><br>
           <label><input type="checkbox" value="internet"> Internet</label><br>
           <label><input type="checkbox" value="firm-mattress"> Firm Mattress</label>
         </td>
       </tr>
       <tr>
         <td class="label">Mode of Payment</td>
         <td>
          <label><input type="checkbox" name="payment" value="cash"> Cash</label>
          <label><input type="checkbox" name="payment" value="check"> Check </label<br>
            <label><input type="checkbox" name="payment" value="card">Credit Card </label>
            <select name="card">
             <option>Select Card</option>
             <option>Visa</option>
             <option>MasterCard</option>
             <option>American Express</option>
            </select>
         </td>
       </tr>
       <tr>
         <td colspan="2" class="submit">
           <input type="submit" value="Send Data">
         </td>
        </tr>
      </table>
</form>
</div>
</body>
</html>
